    <script>
      // Gracefully handle & prevent noisy browser extension errors (e.g. TronLink / crypto wallet content scripts)
      (function () {
        function isExtensionError(msg, filename) {
          var str = String(msg || '') + ' ' + String(filename || '');
          return (
            str.indexOf('tronlinkParams') !== -1 ||
            str.indexOf('trap returned falsish') !== -1 ||
            str.indexOf('TronWeb') !== -1 ||
            str.indexOf('ObjectMultiplex') !== -1 ||
            str.indexOf('MaxListenersExceededWarning') !== -1 ||
            str.indexOf('contentscript.js') !== -1 ||
            str.indexOf('injected.js') !== -1
          );
        }

        window.addEventListener('error', function (event) {
          var msg = event && (event.message || (event.error && event.error.message));
          var filename = event && event.filename;
          if (isExtensionError(msg, filename)) {
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
            if (event.preventDefault) event.preventDefault();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function (event) {
          var reason = event && event.reason;
          var msg = (reason && reason.message) || String(reason || '');
          if (isExtensionError(msg, '')) {
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
            if (event.preventDefault) event.preventDefault();
          }
        }, true);
      })();
    </script>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('amm_theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var activeTheme = saved ? saved : (prefersDark ? 'dark' : 'dark');
          if (activeTheme === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
            document.documentElement.setAttribute('data-theme', 'dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
            document.documentElement.setAttribute('data-theme', 'light');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
